# Requires these masked/protected GitLab CI/CD variables (Settings > CI/CD > Variables):
#   CI_REGISTRY_USER / CI_REGISTRY_PASSWORD  -> auto-provided for GitLab Container Registry
#   GITOPS_TOKEN        -> PAT with write access to the gitops repo
#   GITOPS_REPO_HOST     e.g. gitlab.com
#   GITOPS_REPO_PATH     e.g. yourgroup/rag-platform-gitops
#
# Trigger model: `test` branch pushes still build per-changed-service, same as
# always. `main` branch pushes no longer trigger anything — production only
# ships when a semver tag (vX.Y.Z) is pushed manually, and a release tag
# rebuilds+deploys all three services unconditionally (a tag has no
# meaningful "previous commit" to diff against for change detection).
stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  GIT_DEPTH: "0"   # full history needed for the tag-is-on-main check below

# Each service builds, pushes, and bumps only its own tag key in the GitOps repo.
# rules:changes uses a literal path per job (not a $SERVICE-interpolated one) —
# GitLab's variable expansion inside rules:changes is unreliable across versions,
# so this avoids that risk entirely rather than relying on it.
.build_and_deploy_template: &build_and_deploy
  stage: build
  image: docker:24
  services: ["docker:24-dind"]
  script:
    - apk add --no-cache git
    # A release tag is assumed to point at a commit that has landed on main —
    # everything downstream (targeting values-main.yaml) relies on that. Fail
    # fast, before building or pushing anything, if that assumption is false.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git fetch origin main
        if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; then
          echo "Tag $CI_COMMIT_TAG points to $CI_COMMIT_SHA, which is not on main — refusing to release."
          exit 1
        fi
      fi
    # Tag pipelines have no $CI_COMMIT_BRANCH (it's only set for branch
    # pushes) — a release tag always targets the main/production values file,
    # and the image is named after the tag itself (not the commit SHA) so the
    # published artifact is traceable straight back to the release.
    - 'if [ -n "$CI_COMMIT_TAG" ]; then ENVIRONMENT="main"; IMAGE_TAG="$CI_COMMIT_TAG"; else ENVIRONMENT="$CI_COMMIT_BRANCH"; IMAGE_TAG="$CI_COMMIT_SHORT_SHA"; fi'
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG" "apps/$SERVICE"
    - docker push "$CI_REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG"
    - 'git clone "https://oauth2:${GITOPS_TOKEN}@${GITOPS_REPO_HOST}/${GITOPS_REPO_PATH}.git" gitops'
    - cd gitops
    - 'VALUES_FILE="charts/rag-platform/values-${ENVIRONMENT}.yaml"'
    # Both registry: and tag: are nested under this service's own top-level key
    # now (not a shared image: block) — sed's address range (/^key:/,/^[a-zA-Z]/)
    # scopes each replacement to lines between this key and the next top-level
    # key, so sibling services' registry/tag lines (same text, different blocks)
    # are left untouched. This matters because two services can be built by two
    # different CI systems pointing at two different registries (e.g. rag-api
    # via GitLab, chat-ui via GitHub/ghcr.io) — clobbering a shared field would
    # silently break whichever service didn't just get rebuilt.
    - 'sed -i "/^${VALUES_KEY}:/,/^[a-zA-Z]/{s#registry:.*#registry: \"${CI_REGISTRY_IMAGE}\"#}" "$VALUES_FILE"'
    - 'sed -i "/^${VALUES_KEY}:/,/^[a-zA-Z]/{s#tag:.*#tag: \"${IMAGE_TAG}\"#}" "$VALUES_FILE"'
    - 'git config user.email "ci@gitlab.local"'
    - 'git config user.name "gitlab-ci"'
    - 'git commit -am "chore: bump ${ENVIRONMENT} ${SERVICE} image to ${IMAGE_TAG}" || echo "nothing to commit"'
    - git push origin HEAD:main

build-rag-api:
  <<: *build_and_deploy
  variables:
    SERVICE: rag-api
    VALUES_KEY: ragApi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH == "test"'
      changes:
        - apps/rag-api/**/*

build-ingestion-worker:
  <<: *build_and_deploy
  variables:
    SERVICE: ingestion-worker
    VALUES_KEY: ingestionWorker
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH == "test"'
      changes:
        - apps/ingestion-worker/**/*

build-chat-ui:
  <<: *build_and_deploy
  variables:
    SERVICE: chat-ui
    VALUES_KEY: chatUi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH == "test"'
      changes:
        - apps/chat-ui/**/*
