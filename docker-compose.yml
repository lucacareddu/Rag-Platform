# Local dev only — exposes the RAG API on http://localhost:8080
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
    # Pulls the model on first start if not already cached in the volume.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull phi4-mini && wait"]

  rag-api:
    build: ./apps/rag-api
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      INGESTION_URL: http://ingestion-worker:8001
      OLLAMA_BASE_URL: http://ollama:11434/v1
    depends_on: [qdrant, ollama]

  ingestion-worker:
    build: ./apps/ingestion-worker
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes: ["./documents:/data:ro"]
    depends_on: [qdrant]

  nginx:
    image: nginx:alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on: [rag-api]

volumes:
  ollama-data:
