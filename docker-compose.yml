# Local dev only — RAG API on http://localhost:8000, chat UI on http://localhost:4200
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]

  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-localdevpassword}
      # Capped well below the default heuristics, which size off total host RAM.
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["7474:7474", "7687:7687"]   # 7474 = Neo4j Browser, 7687 = Bolt
    volumes: ["neo4j-data:/data"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: -1   # never unload the model from VRAM
    # Pulls the model, then loads it into VRAM right away.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull gemma2:2b && ollama run gemma2:2b hi < /dev/null > /dev/null && wait"]

  rag-api:
    build: ./apps/rag-api
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      INGESTION_URL: http://ingestion-worker:8001
      OLLAMA_BASE_URL: http://ollama:11434/v1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-localdevpassword}
    ports: ["8000:8000"]   # exposed for direct curl/debugging; the chat UI never calls this from the browser
    depends_on: [qdrant, ollama, neo4j]

  ingestion-worker:
    build: ./apps/ingestion-worker
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-localdevpassword}
    volumes: ["./documents:/data:ro"]
    depends_on: [qdrant, neo4j]

  chat-ui:
    build: ./apps/chat-ui
    environment:
      RAG_API_URL: http://rag-api:8000
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports: ["4200:8080"]
    depends_on: [rag-api]

  nginx:
    image: nginx:alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on: [rag-api]

volumes:
  ollama-data:
  neo4j-data:
