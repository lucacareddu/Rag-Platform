# Mirrors .gitlab-ci.yml but pushes images to ghcr.io instead of the GitLab
# Container Registry. Both pipelines commit to the same GitOps repo, so they
# can run side by side without conflict.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   GITOPS_TOKEN       -> GitLab PAT/Project Access Token with write_repository scope
#   GITOPS_REPO_HOST    e.g. gitlab.com
#   GITOPS_REPO_PATH    e.g. yourgroup/rag-platform-gitops
# GITHUB_TOKEN (pushing to ghcr.io) is auto-provided, no setup needed.
#
# Trigger model: `test` branch pushes still build per-changed-service, same as
# always. `main` branch pushes no longer trigger anything — production only
# ships when a semver tag (vX.Y.Z) is pushed manually, and a release tag
# rebuilds+deploys all three services unconditionally (a tag has no
# meaningful "previous commit" to diff against for change detection).

name: CI

on:
  push:
    branches: [test]
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/rag-platform

jobs:
  # Skipped for tag pushes — change detection only makes sense for branch
  # pushes. Build jobs below fall back to "always run" when triggered by a tag.
  detect-changes:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    outputs:
      rag-api: ${{ steps.filter.outputs.rag-api }}
      ingestion-worker: ${{ steps.filter.outputs.ingestion-worker }}
      chat-ui: ${{ steps.filter.outputs.chat-ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the previous commit too, so paths-filter can diff against it
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            rag-api:
              - 'apps/rag-api/**'
            ingestion-worker:
              - 'apps/ingestion-worker/**'
            chat-ui:
              - 'apps/chat-ui/**'

  # Three separate jobs (not a matrix) because job-level `if:` can't reference
  # the matrix context to look up a dynamic key in detect-changes' outputs —
  # each job instead checks its own literal, named output. `!failure() &&
  # !cancelled()` lets these run even though detect-changes is skipped on tag
  # pushes (a skipped dependency otherwise skips its dependents by default).
  build-rag-api:
    needs: detect-changes
    if: "!failure() && !cancelled() && (github.ref_type == 'tag' || needs.detect-changes.outputs.rag-api == 'true')"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-service.yml
    with:
      service: rag-api
      values_key: ragApi
      environment: ${{ github.ref_type == 'tag' && 'main' || github.ref_name }}
    secrets: inherit

  build-ingestion-worker:
    needs: detect-changes
    if: "!failure() && !cancelled() && (github.ref_type == 'tag' || needs.detect-changes.outputs.ingestion-worker == 'true')"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-service.yml
    with:
      service: ingestion-worker
      values_key: ingestionWorker
      environment: ${{ github.ref_type == 'tag' && 'main' || github.ref_name }}
    secrets: inherit

  build-chat-ui:
    needs: detect-changes
    if: "!failure() && !cancelled() && (github.ref_type == 'tag' || needs.detect-changes.outputs.chat-ui == 'true')"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-service.yml
    with:
      service: chat-ui
      values_key: chatUi
      environment: ${{ github.ref_type == 'tag' && 'main' || github.ref_name }}
    secrets: inherit
