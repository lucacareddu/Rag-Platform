# Mirrors .gitlab-ci.yml but pushes images to ghcr.io instead of the GitLab
# Container Registry. Both pipelines commit to the same GitOps repo, so they
# can run side by side without conflict.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   GITOPS_TOKEN       -> GitLab PAT/Project Access Token with write_repository scope
#   GITOPS_REPO_HOST    e.g. gitlab.com
#   GITOPS_REPO_PATH    e.g. yourgroup/rag-platform-gitops
# GITHUB_TOKEN (pushing to ghcr.io) is auto-provided, no setup needed.

name: CI

on:
  push:
    branches: [main, test]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/rag-platform

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      rag-api: ${{ steps.filter.outputs.rag-api }}
      ingestion-worker: ${{ steps.filter.outputs.ingestion-worker }}
      chat-ui: ${{ steps.filter.outputs.chat-ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rag-api:
              - 'apps/rag-api/**'
            ingestion-worker:
              - 'apps/ingestion-worker/**'
            chat-ui:
              - 'apps/chat-ui/**'

  # Three separate jobs (not a matrix) because job-level `if:` can't reference
  # the matrix context to look up a dynamic key in detect-changes' outputs —
  # each job instead checks its own literal, named output.
  build-rag-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.rag-api == 'true'
    uses: ./.github/workflows/build-service.yml
    with:
      service: rag-api
      values_key: ragApi
    secrets: inherit

  build-ingestion-worker:
    needs: detect-changes
    if: needs.detect-changes.outputs.ingestion-worker == 'true'
    uses: ./.github/workflows/build-service.yml
    with:
      service: ingestion-worker
      values_key: ingestionWorker
    secrets: inherit

  build-chat-ui:
    needs: detect-changes
    if: needs.detect-changes.outputs.chat-ui == 'true'
    uses: ./.github/workflows/build-service.yml
    with:
      service: chat-ui
      values_key: chatUi
    secrets: inherit
