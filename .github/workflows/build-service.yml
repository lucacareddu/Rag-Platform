name: Build and deploy one service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      values_key:
        required: true
        type: string
      environment:
        description: >-
          Target values-<environment>.yaml in the GitOps repo. "main" for
          release-tag builds, otherwise the source branch name (e.g. "test").
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/rag-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A release tag names the image after the tag itself (not the commit
      # SHA) so the published artifact is traceable straight back to the
      # release; other builds (test branch) keep the short SHA as before.
      - name: Compute image tag
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "image_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=$(echo ${{ github.sha }} | cut -c1-8)" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ inputs.service }}
          push: true
          tags: ${{ env.IMAGE_BASE }}/${{ inputs.service }}:${{ steps.vars.outputs.image_tag }}

      - name: Bump this service's tag in the GitOps repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO_HOST: ${{ secrets.GITOPS_REPO_HOST }}
          GITOPS_REPO_PATH: ${{ secrets.GITOPS_REPO_PATH }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          VALUES_KEY: ${{ inputs.values_key }}
          SERVICE: ${{ inputs.service }}
        run: |
          git clone "https://oauth2:${GITOPS_TOKEN}@${GITOPS_REPO_HOST}/${GITOPS_REPO_PATH}.git" gitops
          cd gitops
          VALUES_FILE="charts/rag-platform/values-${ENVIRONMENT}.yaml"
          # Both registry: and tag: are nested under this service's own
          # top-level key now (not a shared image: block) — the address range
          # scopes each replacement to only that block, verified against a real
          # multi-service values.yaml (see .gitlab-ci.yml). This matters because
          # rag-api might be built by GitLab and chat-ui by GitHub in the same
          # branch, pointing at two different registries — clobbering a shared
          # field would silently break whichever service didn't just rebuild.
          sed -i "/^${VALUES_KEY}:/,/^[a-zA-Z]/{s#registry:.*#registry: \"${IMAGE_BASE}\"#}" "$VALUES_FILE"
          sed -i "/^${VALUES_KEY}:/,/^[a-zA-Z]/{s#tag:.*#tag: \"${IMAGE_TAG}\"#}" "$VALUES_FILE"
          git config user.email "ci@github-actions.local"
          git config user.name "github-actions"
          git commit -am "chore: bump ${ENVIRONMENT} ${SERVICE} image to ${IMAGE_TAG} (via GitHub Actions)" || echo "nothing to commit"
          git push origin HEAD:main
