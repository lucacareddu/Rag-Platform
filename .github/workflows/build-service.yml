name: Build and deploy one service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      values_key:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/rag-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ inputs.service }}
          push: true
          tags: ${{ env.IMAGE_BASE }}/${{ inputs.service }}:${{ steps.vars.outputs.short_sha }}

      - name: Bump this service's tag in the GitOps repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO_HOST: ${{ secrets.GITOPS_REPO_HOST }}
          GITOPS_REPO_PATH: ${{ secrets.GITOPS_REPO_PATH }}
          BRANCH: ${{ github.ref_name }}
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
          VALUES_KEY: ${{ inputs.values_key }}
          SERVICE: ${{ inputs.service }}
        run: |
          git clone "https://oauth2:${GITOPS_TOKEN}@${GITOPS_REPO_HOST}/${GITOPS_REPO_PATH}.git" gitops
          cd gitops
          VALUES_FILE="charts/rag-platform/values-${BRANCH}.yaml"
          sed -i "s#registry:.*#registry: \"${IMAGE_BASE}\"#" "$VALUES_FILE"
          # Only this service's own tag key gets patched — see .gitlab-ci.yml
          # for the same address-range technique, verified there against a
          # real multi-service values.yaml.
          sed -i "/^${VALUES_KEY}:/,/^[a-zA-Z]/{s#tag:.*#tag: \"${IMAGE_TAG}\"#}" "$VALUES_FILE"
          git config user.email "ci@github-actions.local"
          git config user.name "github-actions"
          git commit -am "chore: bump ${BRANCH} ${SERVICE} image to ${IMAGE_TAG} (via GitHub Actions)" || echo "nothing to commit"
          git push origin HEAD:main
